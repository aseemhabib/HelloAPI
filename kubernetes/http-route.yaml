apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: api-routes

spec:
  parentRefs:
    - name: traefik-gateway

  rules:

    - matches:
        - path:
            type: PathPrefix
            value: /api/hello

        - path:
            type: PathPrefix
            value: /api/cpu-test

      backendRefs:
        - name: hello-api-service
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /api/user

        - path:
            type: PathPrefix
            value: /api/users

        - path:
            type: PathPrefix
            value: /api/auth
      backendRefs:
        - name: user-api-service
          port: 80